<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지난 브리핑 - 신흥글로벌 데일리 뉴스</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --text:#1a1d24; --sub:#5b6472; --border:#e3e7ee;
    --accent:#2f5fe0; --accent2:#1c9d6b; --danger:#e0402f; --nav-bg:#1a2540; --nav-text:#eef1f8;
    --chip-bg:#eef2fb;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12151c; --card:#1b202b; --text:#eef1f7; --sub:#9aa4b5; --border:#2a3140;
      --accent:#6c93ff; --accent2:#3fcf95; --danger:#ff6b5e; --nav-bg:#0d1220; --nav-text:#eef1f8;
      --chip-bg:#22283a;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12151c; --card:#1b202b; --text:#eef1f7; --sub:#9aa4b5; --border:#2a3140;
    --accent:#6c93ff; --accent2:#3fcf95; --danger:#ff6b5e; --nav-bg:#0d1220; --nav-text:#eef1f8;
    --chip-bg:#22283a;
  }
  :root[data-theme="light"]{
    --bg:#f4f6f9; --card:#ffffff; --text:#1a1d24; --sub:#5b6472; --border:#e3e7ee;
    --accent:#2f5fe0; --accent2:#1c9d6b; --danger:#e0402f; --nav-bg:#1a2540; --nav-text:#eef1f8;
    --chip-bg:#eef2fb;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Helvetica,Arial,sans-serif;
    font-size:16px; line-height:1.5; padding-bottom:32px;
  }

  .page-tabs{ display:flex; width:100%; background:var(--card); border-bottom:1px solid var(--border); }
  .page-tabs a{ flex:1; text-align:center; padding:12px 4px; font-size:14px; font-weight:800; color:var(--sub); text-decoration:none; border-bottom:3px solid transparent; }
  .page-tabs a.active{ color:var(--accent); border-bottom-color:var(--accent); }

  header.top{ padding:18px 16px 6px; }
  header.top h1{ margin:0 0 4px; font-size:20px; font-weight:800; }
  header.top .sub{ color:var(--sub); font-size:13px; }

  main{ padding:8px 16px 6px; }

  .date-list{ display:flex; flex-direction:column; gap:8px; }
  a.date-card{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:14px 16px; text-decoration:none; color:var(--text);
    box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  a.date-card:active{ opacity:.7; }
  .d-main{ display:flex; flex-direction:column; gap:2px; }
  .d-date{ font-weight:800; font-size:16px; }
  .d-weekday{ color:var(--sub); font-size:13px; }
  .d-arrow{ color:var(--sub); font-size:18px; }

  .empty-card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:28px 16px; text-align:center; color:var(--sub); font-size:14px; line-height:1.8;
  }

  footer.foot{ padding:20px 16px 10px; color:var(--sub); font-size:12px; line-height:1.7; }
  footer.foot .rule{ border-top:1px solid var(--border); margin-bottom:14px; }
</style>
</head>
<body>

<div class="page-tabs">
  <a href="../index.html">오늘의 브리핑</a>
  <a href="index.html" class="active">지난 브리핑</a>
</div>

<header class="top">
  <h1>지난 브리핑</h1>
  <div class="sub">날짜를 누르면 해당 날짜의 브리핑 전체 내용을 볼 수 있습니다 (최근 1개월 보관)</div>
</header>

<main>
  <div class="date-list" id="date-list">
    <div class="empty-card">아직 보관된 지난 브리핑이 없습니다.<br>오늘부터 발행되는 브리핑이 하나씩 이곳에 쌓입니다.</div>
  </div>
</main>

<footer class="foot">
  <div class="rule"></div>
  평일(월~금) 브리핑만 보관되며, 발행일 기준 최근 1개월이 지난 항목은 목록에서 자동으로 제외됩니다.
</footer>

</body>
</html>
